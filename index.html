<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Keizoku Task Tracker</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="app">

        <header class="app-header">

            <div class="app-label">
                Keizoku DevOps • Task Tracker
            </div>

            <h1>
                Task Tracker
            </h1>

            <p class="app-description">
                A simple JavaScript application for creating,
                completing and managing tasks.
            </p>

        </header>


        <section
            class="task-entry"
            aria-label="Add task"
        >

            <form id="task-form">

                <input
                    id="task-input"
                    type="text"
                    placeholder="Enter a task..."
                    autocomplete="off"
                    aria-label="Task name"
                >

                <select
                    id="priority-input"
                    aria-label="Task priority"
                >
                    <option value="Low">
                        Low
                    </option>

                    <option
                        value="Medium"
                        selected
                    >
                        Medium
                    </option>

                    <option value="High">
                        High
                    </option>
                </select>

                <button
                    class="add-task-button"
                    type="submit"
                >
                    Add Task
                </button>

            </form>

            <p
                id="error-message"
                class="error-message"
                aria-live="polite"
            ></p>

        </section>


        <section
            class="stats"
            aria-label="Task statistics"
        >

            <div class="stat">
                <span id="total-count">
                    0
                </span>

                <small>
                    Total
                </small>
            </div>

            <div class="stat">
                <span id="remaining-count">
                    0
                </span>

                <small>
                    To Do
                </small>
            </div>

            <div class="stat">
                <span id="completed-count">
                    0
                </span>

                <small>
                    Done
                </small>
            </div>

            <div class="stat">
                <span id="deleted-count">
                    0
                </span>

                <small>
                    Deleted
                </small>
            </div>

        </section>


        <section class="tasks-section">

            <div class="section-heading">

                <div>

                    <div class="section-label">
                        Workspace
                    </div>

                    <h2>
                        Tasks
                    </h2>

                </div>

                <button
                    id="clear-history-button"
                    class="clear-history-button"
                    type="button"
                    hidden
                >
                    Clear History
                </button>

            </div>


            <div
                class="task-table"
                role="table"
                aria-label="Tasks"
            >

                <div
                    class="task-table-header"
                    role="row"
                >

                    <div
                        class="checkbox-column"
                        role="columnheader"
                        aria-label="Complete task"
                    ></div>


                    <button
                        id="number-header"
                        class="column-header sort-header active"
                        type="button"
                        role="columnheader"
                    >
                        <span>
                            Task #
                        </span>

                        <span
                            id="number-sort-indicator"
                            class="sort-indicator"
                        >
                            ↑
                        </span>
                    </button>


                    <button
                        id="task-name-header"
                        class="column-header sort-header"
                        type="button"
                        role="columnheader"
                    >
                        <span>
                            Task
                        </span>

                        <span
                            id="task-name-sort-indicator"
                            class="sort-indicator"
                        ></span>
                    </button>


                    <div
                        class="column-header compound-header"
                        role="columnheader"
                    >

                        <button
                            id="priority-sort-button"
                            class="column-sort-button"
                            type="button"
                        >
                            <span>
                                Priority
                            </span>

                            <span
                                id="priority-sort-indicator"
                                class="sort-indicator"
                            ></span>
                        </button>

                        <select
                            id="priority-filter"
                            class="header-filter"
                            aria-label="Filter tasks by priority"
                        >
                            <option value="all">
                                All
                            </option>

                            <option value="High">
                                High
                            </option>

                            <option value="Medium">
                                Medium
                            </option>

                            <option value="Low">
                                Low
                            </option>
                        </select>

                    </div>


                    <div
                        class="column-header compound-header"
                        role="columnheader"
                    >

                        <button
                            id="status-sort-button"
                            class="column-sort-button"
                            type="button"
                        >
                            <span>
                                Status
                            </span>

                            <span
                                id="status-sort-indicator"
                                class="sort-indicator"
                            ></span>
                        </button>

                        <select
                            id="status-filter"
                            class="header-filter"
                            aria-label="Filter tasks by status"
                        >
                            <option value="all">
                                All
                            </option>

                            <option value="todo">
                                To Do
                            </option>

                            <option value="done">
                                Done
                            </option>

                            <option value="deleted">
                                Deleted
                            </option>
                        </select>

                    </div>

                </div>


                <ul
                    id="task-list"
                    class="task-list"
                ></ul>


                <div
                    id="empty-state"
                    class="empty-state"
                >
                    No tasks yet.
                </div>

            </div>

        </section>

    </main>


    <script src="app.js"></script>

</body>

</html>
